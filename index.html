<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todoapp</title>
  </head>
  <body>
    <div id="root">
      <div id="js-loading" style="padding:40px;font-family:sans-serif;color:#666">
        Loading app… (if this persists, JavaScript may be blocked)
      </div>
    </div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('js-loading');
        if (el) el.innerHTML = '<b style="color:red">JS Error:</b><br><pre style="font-size:12px;white-space:pre-wrap">' + msg + '\n' + (err && err.stack ? err.stack : src + ':' + line) + '</pre>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('js-loading');
        if (el) el.innerHTML = '<b style="color:red">Unhandled Promise Rejection:</b><br><pre style="font-size:12px;white-space:pre-wrap">' + String(e.reason && e.reason.stack || e.reason) + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
